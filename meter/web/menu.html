<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farever Book</title>
<style id="css">/*CSS*/</style>
</head>
<body>
<div id="app">
  <!-- The window's title bar, drawn by the page: it moves the window (a
       double click maximises) and holds the window's buttons. -->
  <div id="titlebar">
    <span class="tb-title">Farever Book</span>
    <span class="spacer"></span>
    <div id="winctl">
      <button type="button" data-win="min" data-i18n-title="Réduire" title="Réduire"><svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg></button>
      <button type="button" data-win="max" data-i18n-title="Agrandir" title="Agrandir"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
      <button type="button" data-win="close" class="close" data-i18n-title="Fermer" title="Fermer"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </div>
  <header id="top">
    <!-- Three columns: the name, the game's state in the middle, the
         right-hand group; one under the other when they don't fit. -->
    <div id="topleft">
      <span class="brand">Farever <b>Book</b></span>
      <span id="version"></span>
    </div>
    <!-- The game's state in the middle of the band: a Play button, or "En
         jeu" over the server; the Steam account under it. -->
    <div id="linkcol">
      <div id="link"></div>
      <div id="account"></div>
    </div>
    <!-- The rift countdown, always in view whatever the page. -->
    <!-- The right-hand group: it goes under the name, whole, when the
         window is too narrow for one line. -->
    <div id="topright">
      <div id="riftclock" class="card">
        <div class="t"></div><div class="v"></div><div class="s"></div><div class="w"></div>
      </div>
      <!-- Réglages and Aide, as icons next to the game's state. -->
      <div id="appcol">
        <div id="appbtns"></div>
        <!-- Support the project (Tipeee), under them. -->
        <div id="supportslot"></div>
      </div>
    </div>
  </header>

  <!-- A newer version: a band under the header, until it is installed. -->
  <div id="updbar"></div>

  <nav id="nav"></nav>

  <main id="page"></main>
</div>

<!-- Grips on the window's edges and corners: the frame is the page's now. -->
<div class="grip" data-edge="n"></div><div class="grip" data-edge="s"></div>
<div class="grip" data-edge="w"></div><div class="grip" data-edge="e"></div>
<div class="grip" data-edge="nw"></div><div class="grip" data-edge="ne"></div>
<div class="grip" data-edge="sw"></div><div class="grip" data-edge="se"></div>

<script>/*JS*/</script>
</body>
</html>
